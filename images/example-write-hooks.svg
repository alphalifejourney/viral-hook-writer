<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 690" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="760" height="690" rx="16" fill="#FFFFFF" stroke="#E5E5E5"/>
<rect width="760" height="44" rx="16" fill="#F7F5F0"/><rect y="28" width="760" height="16" fill="#F7F5F0"/>
<circle cx="24" cy="22" r="6" fill="#E06C5A"/><circle cx="44" cy="22" r="6" fill="#E8B04B"/><circle cx="64" cy="22" r="6" fill="#74AA9C"/>
<text x="380.0" y="27" text-anchor="middle" font-size="13" fill="#666">Example 1 · Write hooks</text>
<rect x="170" y="78" width="560" height="64" rx="14" fill="#F3F1EC"/><text x="188" y="106" font-size="14" fill="#111">Write hooks for my dermatology clinic. The video is about</text><text x="188" y="126" font-size="14" fill="#111">why adults still get acne. My viewers are working women 25-40.</text><text x="730" y="70" text-anchor="end" font-size="11" fill="#999">You</text><circle cx="38" cy="176" r="9" fill="#C15F3C"/><text x="54" y="180" font-size="11" fill="#999">Claude · viral-hook-writer skill</text><text x="30" y="206" font-size="16" font-weight="700" fill="#111">Hooks for: Dermatology clinic – Why adults still get acne</text><rect x="30" y="232" width="700" height="30" rx="8" fill="#FAFAFA" stroke="#EEE"/><text x="44" y="252" font-size="14" fill="#999">1.</text><text x="66" y="252" font-size="12" fill="#C15F3C" font-weight="700">MYTH</text><text x="210" y="252" font-size="14" fill="#111">Acne stops after your teens? Not true.</text><rect x="662" y="236" width="54" height="22" rx="11" fill="#74AA9C"/><text x="689" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">10/10</text><rect x="30" y="266" width="700" height="30" rx="8" fill="#FAFAFA" stroke="#EEE"/><text x="44" y="286" font-size="14" fill="#999">2.</text><text x="66" y="286" font-size="12" fill="#C15F3C" font-weight="700">CONTRAST</text><text x="210" y="286" font-size="14" fill="#111">Pimples at 16 or at 32? What changed?</text><rect x="662" y="270" width="54" height="22" rx="11" fill="#74AA9C"/><text x="689" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">10/10</text><rect x="30" y="300" width="700" height="30" rx="8" fill="#FAFAFA" stroke="#EEE"/><text x="44" y="320" font-size="14" fill="#999">3.</text><text x="66" y="320" font-size="12" fill="#C15F3C" font-weight="700">QUESTION</text><text x="210" y="320" font-size="14" fill="#111">Why do you still get pimples at 30?</text><rect x="662" y="304" width="54" height="22" rx="11" fill="#74AA9C"/><text x="689" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">9/10</text><rect x="30" y="334" width="700" height="30" rx="8" fill="#FAFAFA" stroke="#EEE"/><text x="44" y="354" font-size="14" fill="#999">4.</text><text x="66" y="354" font-size="12" fill="#C15F3C" font-weight="700">BEHIND THE SCENES</text><text x="210" y="354" font-size="14" fill="#111">This is what&#x27;s really behind your adult acne.</text><rect x="662" y="338" width="54" height="22" rx="11" fill="#74AA9C"/><text x="689" y="354" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">9/10</text><rect x="30" y="368" width="700" height="30" rx="8" fill="#FAFAFA" stroke="#EEE"/><text x="44" y="388" font-size="14" fill="#999">5.</text><text x="66" y="388" font-size="12" fill="#C15F3C" font-weight="700">WARNING</text><text x="210" y="388" font-size="14" fill="#111">Don&#x27;t cover another breakout until you watch this.</text><rect x="662" y="372" width="54" height="22" rx="11" fill="#74AA9C"/><text x="689" y="388" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">9/10</text><rect x="30" y="402" width="700" height="30" rx="8" fill="#FAFAFA" stroke="#EEE"/><text x="44" y="422" font-size="14" fill="#999">6.</text><text x="66" y="422" font-size="12" fill="#C15F3C" font-weight="700">SURPRISING FACT</text><text x="210" y="422" font-size="14" fill="#111">You can get acne for the first time at 30.</text><rect x="662" y="406" width="54" height="22" rx="11" fill="#74AA9C"/><text x="689" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">9/10</text><text x="44" y="454" font-size="13" fill="#999">… plus 4 more, sorted best first</text><text x="30" y="490" font-size="15" font-weight="700" fill="#111">Top 3</text><text x="30" y="516" font-size="14" fill="#111">🥇 <tspan font-weight="700">Acne stops after your teens? Not true.</tspan> <tspan fill="#666">– breaks a belief many grown women hold</tspan></text><text x="30" y="542" font-size="14" fill="#111">🥈 <tspan font-weight="700">Pimples at 16 or at 32? What changed?</tspan> <tspan fill="#666">– the comparison makes viewers want the reason</tspan></text><text x="30" y="568" font-size="14" fill="#111">🥉 <tspan font-weight="700">Why do you still get pimples at 30?</tspan> <tspan fill="#666">– asks the exact question your viewers have</tspan></text><rect x="30" y="584" width="700" height="58" rx="10" fill="#EEF5FD"/><text x="46" y="606" font-size="13" fill="#111"><tspan font-weight="700">First second on screen:</tspan> a woman in work clothes checks a pimple in the</text><text x="46" y="626" font-size="13" fill="#111">mirror, then a big "NOT TRUE" stamp pops onto the screen.</text><text x="30" y="664" font-size="12" fill="#2E7D6B">✓ No cure promises   ✓ No made-up facts   ✓ Every hook 12 words or less</text></svg>