<rect width="760" height="566" rx="16" fill="#FFFFFF" stroke="#E5E5E5"/>
<rect width="760" height="44" rx="16" fill="#F7F5F0"/><rect y="28" width="760" height="16" fill="#F7F5F0"/>
<circle cx="24" cy="22" r="6" fill="#E06C5A"/><circle cx="44" cy="22" r="6" fill="#E8B04B"/><circle cx="64" cy="22" r="6" fill="#74AA9C"/>
<text x="380.0" y="27" text-anchor="middle" font-size="13" fill="#666">Example 2 · Grade your own hooks</text>
<rect x="170" y="78" width="560" height="104" rx="14" fill="#F3F1EC"/><text x="188" y="106" font-size="14" fill="#111">Grade these hooks for my dermatology clinic:</text><text x="188" y="126" font-size="14" fill="#111">1) Hi everyone, welcome to Glow Skin Clinic, today we talk about acne.</text><text x="188" y="146" font-size="14" fill="#111">2) Our treatment cures acne in 7 days guaranteed.</text><text x="188" y="166" font-size="14" fill="#111">3) Why do you still get pimples at 30?</text><text x="730" y="70" text-anchor="end" font-size="11" fill="#999">You</text><circle cx="38" cy="216" r="9" fill="#C15F3C"/><text x="54" y="220" font-size="11" fill="#999">Claude · viral-hook-writer skill</text><text x="30" y="250" font-size="12" fill="#666" font-weight="700">RANK   HOOK</text><text x="420" y="250" font-size="12" fill="#666" font-weight="700">SCORE</text><text x="500" y="250" font-size="12" fill="#666" font-weight="700">BIGGEST FIX</text><rect x="24" y="268" width="712" height="38" rx="8" fill="#FAFAFA"/><text x="40" y="292" font-size="14" font-weight="700" fill="#111">1</text><text x="70" y="292" font-size="13" fill="#111">Why do you still get pimples at 30?</text><text x="420" y="292" font-size="14" font-weight="700" fill="#74AA9C">9/10</text><text x="500" y="286" font-size="12" fill="#333">✅ Ready to post.</text><text x="500" y="301" font-size="12" fill="#333"></text><rect x="24" y="312" width="712" height="38" rx="8" fill="#FAFAFA"/><text x="40" y="336" font-size="14" font-weight="700" fill="#111">2</text><text x="70" y="336" font-size="13" fill="#111">Hi everyone, welcome to Glow Skin Clinic, today…</text><text x="420" y="336" font-size="14" font-weight="700" fill="#999">3/10</text><text x="500" y="330" font-size="12" fill="#333">Cut the greeting. Start with</text><text x="500" y="345" font-size="12" fill="#333">the problem.</text><rect x="24" y="356" width="712" height="38" rx="8" fill="#FDECEA"/><text x="40" y="380" font-size="14" font-weight="700" fill="#111">3</text><text x="70" y="380" font-size="13" fill="#111">Our treatment cures acne in 7 days guaranteed.</text><text x="420" y="380" font-size="14" font-weight="700" fill="#C0392B">3/10 ⛔</text><text x="500" y="374" font-size="12" fill="#333">⛔ Promises a cure +</text><text x="500" y="389" font-size="12" fill="#333">guarantee. Say “can help”.</text><text x="30" y="430" font-size="15" font-weight="700" fill="#111">Quick upgrades</text><text x="30" y="458" font-size="13" fill="#999">Hook 2 →</text><text x="100" y="458" font-size="13" fill="#111">Still getting acne in your 30s? Here&#x27;s [what your video explains].</text><text x="730" y="458" text-anchor="end" font-size="13" font-weight="700" fill="#74AA9C">9/10</text><text x="30" y="486" font-size="13" fill="#999">Hook 3 →</text><text x="100" y="486" font-size="13" fill="#111">Stubborn adult acne? Here&#x27;s how [treatment name] can help.</text><text x="730" y="486" text-anchor="end" font-size="13" font-weight="700" fill="#74AA9C">8/10</text><rect x="30" y="506" width="700" height="36" rx="10" fill="#FFF4EE"/><text x="46" y="529" font-size="13" fill="#111">⛔ <tspan font-weight="700">Risky medical promises are always capped at 3/10</tspan>, even if you say they&apos;re true.</text></svg>